apiVersion: v1
kind: ConfigMap
metadata:
  name: ui-html
  namespace: app
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
      <title>My App</title>
      <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #f0f4f8; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.1); text-align: center; max-width: 480px; width: 90%; }
        h1 { color: #2d3748; margin-bottom: 8px; }
        p  { color: #718096; margin-bottom: 24px; }
        button { background: #4299e1; color: white; padding: 12px 28px; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; }
        button:hover { background: #3182ce; }
        #response { margin-top: 20px; padding: 12px; background: #ebf8ff; border-radius: 6px; color: #2b6cb0; display: none; }
      </style>
    </head>
    <body>
      <div class="card">
        <h1>UI Frontend</h1>
        <p>Deployed on AWS EKS</p>
        <button onclick="callBackend()">Call Backend API</button>
        <div id="response"></div>
      </div>
      <script>
        function callBackend() {
          const el = document.getElementById('response');
          el.style.display = 'block';
          el.textContent = 'Calling backend...';
          fetch('/api/')
            .then(r => r.text())
            .then(d => el.textContent = 'Backend says: ' + d.trim())
            .catch(e => el.textContent = 'Error: ' + e);
        }
      </script>
    </body>
    </html>
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ui-nginx-config
  namespace: app
data:
  default.conf: |
    server {
      listen 80;

      location / {
        root /usr/share/nginx/html;
        index index.html;
      }

      location /api/ {
        proxy_pass http://backend/;
        proxy_set_header Host $host;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      containers:
      - name: ui
        image: nginx:alpine
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 64Mi
        volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html
        - name: nginx-config
          mountPath: /etc/nginx/conf.d
      volumes:
      - name: html
        configMap:
          name: ui-html
      - name: nginx-config
        configMap:
          name: ui-nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: ui
  namespace: app
spec:
  type: LoadBalancer
  selector:
    app: ui
  ports:
  - port: 80
    targetPort: 80
